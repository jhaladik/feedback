name = "course-feedback-system"
main = "src/index.ts"
compatibility_date = "2024-11-07"
compatibility_flags = ["nodejs_compat"]

# Rules for importing HTML files as text
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Workers AI binding
[ai]
binding = "AI"

# Durable Objects
[[durable_objects.bindings]]
name = "FEEDBACK_SESSION"
class_name = "FeedbackSession"
script_name = "course-feedback-system"

[[durable_objects.bindings]]
name = "TEACHER_HUB"
class_name = "TeacherHub"
script_name = "course-feedback-system"

# Environment variables for AI providers
# Add these via: wrangler secret put OPENAI_API_KEY
# wrangler secret put ANTHROPIC_API_KEY
[vars]
ENVIRONMENT = "development"

# Durable Object migrations
[[migrations]]
tag = "v1"
new_classes = ["FeedbackSession", "TeacherHub"]
